<script>
const COUNTRIES={ET:{name:"Ethiopia",cur:"ETB",bonus:50,fee:100,usd:130},KE:{name:"Kenya",cur:"KES",bonus:40,fee:100,usd:129},US:{name:"United States",cur:"USD",bonus:1,fee:1,usd:1}};
const TASKS=[{id:"t1",title:"Follow Givana",pts:10,from:"2026-01-01",to:"2026-12-31"},{id:"t2",title:"Subscribe to the channel",pts:10,from:"2026-01-01",to:"2026-12-31"},{id:"t3",title:"Share the campaign",pts:10,from:"2026-01-01",to:"2026-12-31"},{id:"t4",title:"Like the launch post",pts:10,from:"2026-01-01",to:"2026-12-31"},{id:"t5",title:"Autumn awareness quiz",pts:10,from:"2026-12-01",to:"2026-12-31"}];
const PRODUCTS=[{id:"p1",name:"Mobile data bundle",by:"Sponsor: Nile Telecom",usd:3,cost:null,d:"5 GB, valid 30 days."},{id:"p2",name:"School supplies pack",by:"Givana",usd:5,d:"Notebooks and pens."},{id:"p3",name:"Coffee voucher",by:"Sponsor: Habesha Café",usd:2,d:"Two hot drinks."},{id:"p4",name:"Online course credit",by:"Sponsor: LearnHub",usd:8,d:"One course of your choice."}];
const PROJECTS=[{id:"i1",name:"Clean water well, Adama",org:"Verified nonprofit",target:5000,v:"Reviewed 2026-09-14"},{id:"i2",name:"Scholarships for 20 students",org:"Verified institution",target:3000,v:"Reviewed 2026-08-30"},{id:"i3",name:"Community clinic supplies",org:"Verified community project",target:2000,v:"Reviewed 2026-09-22"}];
let mem={};const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):(mem[k]??d)}catch{return mem[k]??d}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let S=store.get("givana",{users:{},ledger:{},tasks:{},paid:{},raised:{},audit:[],rules:{threshold:90,bonus:10},session:null});
let tab="home",offer=0,openedAt={};
const save=()=>store.set("givana",S);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3200)}
const U=()=>S.users[S.session],L=()=>S.ledger[S.session]||[];
const bal=()=>L().reduce((a,e)=>a+e.amt,0);
function audit(a,ref){S.audit.unshift({t:new Date().toISOString(),who:S.session||"system",a,ref})}
function post(type,amt,reason,key){const l=S.ledger[S.session]=S.ledger[S.session]||[];if(l.some(e=>e.key===key))return false;
 if(bal()+amt<0){toast("Not enough points.");return false}
 l.unshift({t:new Date().toISOString(),type,amt,reason,key});audit(type,reason);qualify();save();return true}
function qualify(){}
const qualified=()=>L().some(e=>e.key==="membership-bonus");
function nav(){const items=[["home","▦","nav.dashboard"],["wallet","◔","nav.transactions"],["profile","☺","nav.profile"],["campaigns","✦","nav.campaigns"],["market","★","nav.rewards"],["store","▣","nav.stores"],["network","◈","nav.network"],["sponsors","◆","nav.sponsors"],["impact","♡","nav.impact"],["blog","✎","nav.blog"],["benefits","❖","nav.benefits"],["admin","⚙","nav.admin"]];
 const u=S.session?U():null;
 $("side").innerHTML=`<div class="logo">Giv<i>a</i>na</div><div class="mu" style="margin:-8px 0 8px;font-size:12px">${t("brand.tag")}</div>`+
 items.map(([k,i,n])=>`<button class="nv ${tab===k?"on":""}" data-t="${k}"><span>${i}</span>${t(n)}</button>`).join("")+
 `<select id="lang" aria-label="Language" style="margin:6px 0">${LANGS.map(([c,n])=>`<option value="${c}" ${S.lang===c?"selected":""}>${n}</option>`).join("")}</select>`+
 `<button class="nv" data-t="theme"><span>◐</span>${t("nav.theme")}</button>`+

function campaigns(){if(guard())return;const today=new Date().toISOString().slice(0,10);const done=S.tasks[S.session]=S.tasks[S.session]||{};

 TASKS.map(t=>{const live=today>=t.from&&today<=t.to,d=done[t.id];return`<div class="card row"><div><b>${esc(t.title)}</b><div class="mu">+${t.pts} points · ${t.from} to ${t.to}</div></div><div>${d?`<span class="pill ok">Verified</span>`:!live?`<span class="pill">Not active</span>`:`<button data-o="${t.id}">Open task</button> <button class="pri" data-v="${t.id}">Verify</button>`}</div></div>`}).join("");

 document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const id=b.dataset.v,t=TASKS.find(x=>x.id===id);

async function hashPw(pw,salt){try{const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pw));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const ch of salt+pw)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return"w"+h}}

function normProof(plat,type,val){val=(val||"").trim();
 if(/pass(word|wd)?\s*[:=]|\bpwd\b|\botp\b|\bpin\s*[:=]/i.test(val))return{err:"Never share passwords or codes. Submit only public information."};
 if(type==="LINK"){let u;try{u=new URL(val)}catch(e){return{err:"Enter a full link starting with https://"}}
  if(u.protocol!=="https:")return{err:"Links must start with https://"};const host=u.hostname.replace(/^www\./,"").toLowerCase(),dom=(PLATFORMS[plat]||{}).domains||[];
  if(dom.length&&!dom.some(d=>host===d||host.endsWith("."+d)))return{err:"The link must be on "+dom.join(" or ")+"."};
  return{value:val,key:plat+"|"+host+u.pathname.replace(/\/+$/,"").toLowerCase()}}
 if(type==="HANDLE"){const h=val.replace(/^@/,"");if(!/^[A-Za-z0-9._]{2,40}$/.test(h))return{err:"Enter your public username (letters, numbers, . or _)."};return{value:"@"+h,key:plat+"|@"+h.toLowerCase()}}
 if(type==="SCREENSHOT"){if(!/\.(png|jpe?g|webp)$/i.test(val)||val.length>120)return{err:"Choose an image file (png, jpg or webp)."};return{value:val,key:null}}
 if(val.length<10||val.length>300)return{err:"Write 10 to 300 characters."};return{value:val,key:null}}

   const capHit=t.cap!=null&&tTotal(t)>=t.cap,budgetHit=c.budget&&cSpent(c)+t.pts>c.budget,can2=st==="ACTIVE"&&!er.length&&!pend&&done<t.limitUser&&rej<3&&!capHit&&!budgetHit;

   const pl=(PLATFORMS[t.platform]||{}).name||t.platform;
   return`<div class="dn" style="align-items:flex-start;flex-wrap:wrap;gap:10px"><span style="flex:1;min-width:220px"><b>${esc(t.title)}</b><div class="mu">${esc(KINDS[t.kind]||t.kind)} · ${esc(pl)} · +${t.pts} points · limit ${t.limitUser} per member${t.cap!=null?" · "+Math.max(0,t.cap-tTotal(t))+" spots left":""}</div>

function submitProof(tid,val){const f=findTask(tid);if(!f)return toast("This task no longer exists.");const{c,t}=f,st=cState(c);
 if(st!=="ACTIVE")return toast("This campaign is "+(CSTATUS_LABEL[st]||st).toLowerCase()+".");
 const er=eligibility(c);if(er.length)return toast(er[0]);
 const mine=S.proofs.filter(p=>p.email===S.session&&p.taskId===t.id);
 if(mine.some(p=>p.status==="PENDING_REVIEW"))return toast("You already have a submission waiting for review.");
 if(mine.filter(p=>p.status==="APPROVED").length>=t.limitUser)return toast("You have reached the limit for this task.");
 if(mine.filter(p=>p.status==="REJECTED").length>=3)return toast("Too many rejected attempts for this task.");
 if(t.cap!=null&&tTotal(t)>=t.cap)return toast("This task has reached its completion limit.");
 if(c.budget&&cSpent(c)+t.pts>c.budget)return toast("This campaign's points budget is used up.");
 const n=normProof(t.platform,t.proof,val);if(n.err)return toast(n.err);

 S.proofs.push({id:"pr_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),email:S.session,campaignId:c.id,taskId:t.id,type:t.proof,proof:n.value,key:n.key,status:"PENDING_REVIEW",ms:Date.now()});

function reviewProof(id,ok,reason){const p=S.proofs.find(x=>x.id===id);if(!p||p.status!=="PENDING_REVIEW")return;
 if(!can("verification:review"))return toast("Not allowed.");if(p.email===S.session)return toast("You cannot review your own proof.");

  if(!postAs(p.email,"TASK_BONUS",t.pts,"Campaign task: "+c.title+" / "+t.title,"task-"+t.id+"-"+p.email+"-"+(done+1)))return toast("Points could not be posted.");
  p.status="APPROVED";p.pts=t.pts;(S.tasks[p.email]=S.tasks[p.email]||{})[t.id]=done+1}

 const rh=`<div class="card"><h3>Subscription and renewal</h3><p>${sp.level} · valid until <b>${new Date(sp.subscriptionPlan.endsAt).toLocaleDateString()}</b> ${d<=0?`<span class="pill neg">Expired</span>`:d<=7?`<span class="pill go">${d} days left</span>`:`<span class="pill ok">${d} days left</span>`}</p><p class="mu">When a subscription expires, your products stop showing to members until you renew. To change level, use the plan buttons above.</p><button class="pri" id="renew">Renew for 30 days (simulated payment)</button>${(sp.history||[]).length?`<div class="tw"><table><tr><th>Date</th><th>Type</th><th>Amount</th></tr>${sp.history.slice().reverse().map(h=>`<tr><td>${new Date(h.t).toLocaleDateString()}</td><td>${esc(h.type)}</td><td>${h.amount} ${esc(h.cur)}</td></tr>`).join("")}</table></div>`:""}</div>`;
 $("app").insertAdjacentHTML("beforeend",vh+rh+videosCardHtml(sp));bindVideosCard(sp);
 const vs=$("vsub");if(vs)vs.onclick=()=>{const f=id=>($(id).value||"").trim(),docs=[...$("vd").files].map(x=>x.name);
  if(f("vl").length<3||f("vr").length<3||f("vt").length<3||f("vc").length<2)return toast("Fill in the company name, registration number, tax ID and contact person.");
  if(!/^\+?[0-9 ()-]{9,18}$/.test(f("vp")))return toast("Enter a valid contact phone number.");if(!/^https:\/\/[^\s.]+\.[^\s]+$/.test(f("vw")))return toast("The website must start with https://");
  const names=docs.length?docs:(v?v.docs:[]);if(!names.length)return toast("Add at least one supporting document.");if(names.some(n=>!/\.(pdf|png|jpe?g)$/i.test(n)))return toast("Documents must be PDF, PNG or JPG files.");
  sp.vd={legalName:f("vl"),regNo:f("vr"),taxId:f("vt"),contact:f("vc"),phone:f("vp"),website:f("vw"),docs:names,at:new Date().toISOString()};sp.verificationStatus="PENDING";sp.rejectReason="";audit("SPONSOR_VERIFICATION_SUBMITTED",sp.id);save();render();toast("Submitted for review.")};
 $("renew").onclick=()=>{const p=plan(sp.level),c=COUNTRIES[U().country],amt=Math.round(p.usd*c.usd),from=Math.max(Date.now(),new Date(sp.subscriptionPlan.endsAt).getTime());
  sp.subscriptionPlan.endsAt=new Date(from+30*864e5).toISOString();sp.paymentStatus="PAID";(sp.history=sp.history||[]).push({t:new Date().toISOString(),type:"RENEWAL",amount:amt,cur:c.cur,rate:c.usd});audit("SPONSOR_RENEWED",sp.id);save();render();toast("Renewed for 30 days.")}}
function sponsorReviewHtml(){const pend=Object.entries(S.sponsors).filter(([,x])=>x.verificationStatus==="PENDING"&&x.paymentStatus==="PAID");
 return`<div class="card"><h3>Sponsor approvals</h3><p class="mu">Payment confirms the fee; approval confirms the company. They are separate. A sponsor cannot be approved until verification details are submitted.</p>${pend.map(([k,x])=>{const v=x.vd;return`<div class="dn" style="align-items:flex-start;flex-wrap:wrap;gap:8px"><span><b>${esc(x.companyName)}</b> · ${x.level}${v?`<div class="mu">Legal name: ${esc(v.legalName)} · Reg. no. ${esc(v.regNo)} · Tax ID ${esc(v.taxId)}</div><div class="mu">Contact: ${esc(v.contact)} ${esc(v.phone)} · ${esc(v.website)}</div><div class="mu">Documents (names only in demo): ${v.docs.map(esc).join(", ")}</div>`:'<div class="neg">No verification details submitted yet.</div>'}</span><span><button class="pri" data-ap="${esc(k)}" ${v?"":"disabled"}>Approve</button> <input id="sr-${esc(k)}" aria-label="Rejection reason" placeholder="Reason if rejecting" style="max-width:160px"> <button data-rj="${esc(k)}">Reject</button></span></div>`}).join("")||'<p class="mu">No sponsors waiting.</p>'}</div>`}
function bindSponsorReview(){document.querySelectorAll("[data-ap]").forEach(b=>b.onclick=()=>{const x=S.sponsors[b.dataset.ap];if(!x||!x.vd)return toast("Verification details are missing.");x.verificationStatus="VERIFIED";audit("SPONSOR_APPROVED",b.dataset.ap);save();render()});
 document.querySelectorAll("[data-rj]").forEach(b=>b.onclick=()=>{const r=($("sr-"+b.dataset.rj).value||"").trim();if(!r)return toast("Enter a reason to reject.");const x=S.sponsors[b.dataset.rj];x.verificationStatus="REJECTED";x.rejectReason=r;audit("SPONSOR_REJECTED",b.dataset.rj);save();render()})}

const idb={db:null,mem:{},open(){return new Promise(res=>{try{const r=indexedDB.open("givana-media",1);r.onupgradeneeded=()=>r.result.createObjectStore("v");r.onsuccess=()=>{idb.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
 put(k,b){return new Promise(res=>{idb.mem[k]=b;if(!idb.db)return res(true);try{const tx=idb.db.transaction("v","readwrite");tx.objectStore("v").put(b,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})},
 get(k){return new Promise(res=>{if(idb.mem[k])return res(idb.mem[k]);if(!idb.db)return res(null);try{const q=idb.db.transaction("v").objectStore("v").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})},
 del(k){delete idb.mem[k];if(!idb.db)return;try{idb.db.transaction("v","readwrite").objectStore("v").delete(k)}catch(e){}}};
// ================= LIVE STREAMS =================
const S_ACCESS={MEMBERS:"All members",DONORS:"Members who donated to this case"},SEARLY=15;
const fmtT=ms=>new Date(ms).toLocaleString();
const caseLabel=c=>CATS[c.cat]+" "+c.cat+" support: "+pubName(c)+" ("+c.location+")";
function tickStreams(){const now=Date.now();let ch=false;S.streams.forEach(s=>{const end=(s.status==="LIVE"?s.startedAt:s.startsAt)+s.durMin*60000;
 if(s.status==="LIVE"&&now>end){s.status="ENDED";s.endedAt=now;audit("STREAM_ENDED_AUTO",s.id);ch=true}else if(s.status==="APPROVED"&&now>end){s.status="EXPIRED";audit("STREAM_EXPIRED",s.id);ch=true}});if(ch)save()}
setInterval(tickStreams,20000);
function canWatch(s,w=S.session){if(!w||!S.users[w])return"Sign in to watch.";const r=S.users[w].role||"MEMBER",rev=can("verification:review"),own=s.requestedBy===w;
 if(!["MEMBER","CHARITY_PARTNER","ADMIN","SUPER_ADMIN"].includes(r))return"Your account type cannot watch streams.";
 if(r==="CHARITY_PARTNER"&&!own)return"Only members can watch this stream.";
 if(s.access==="DONORS"&&!own&&!rev&&!(S.gifts[w]||[]).some(g=>g.id===s.caseId))return"This stream is for members who have donated to this case.";return null}
function requestStream(f){const c=S.cases.find(x=>x.id===f.caseId);
 if(!c||c.owner!==S.session)return"Choose one of your own cases.";if(c.status!=="ACTIVE")return"Only verified, active cases can stream.";
 if((f.title||"").trim().length<3||f.title.length>80)return"Enter a title (3 to 80 characters).";
 if(!Number.isFinite(f.startsAt)||f.startsAt<Date.now()+10*60000)return"Pick a start time at least 10 minutes from now.";if(f.startsAt>Date.now()+60*864e5)return"Pick a start within the next 60 days.";
 if(![15,30,45,60].includes(f.durMin))return"Choose a duration of 15, 30, 45 or 60 minutes (the limit is 60).";if(!S_ACCESS[f.access])return"Choose who can watch.";
 if(!f.consent||(f.consentName||"").trim().length<3)return"Consent is required from the person shown, and their name must be recorded.";
 if(S.streams.some(s=>s.caseId===c.id&&["REQUESTED","APPROVED","LIVE"].includes(s.status)))return"This case already has a stream requested or scheduled.";
 S.streams.push({id:"st_"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),caseId:c.id,title:f.title.trim(),startsAt:f.startsAt,durMin:f.durMin,access:f.access,status:"REQUESTED",requestedBy:S.session,consent:{name:f.consentName.trim(),at:Date.now()},created:Date.now()});
 audit("STREAM_REQUESTED",c.id);save();return null}
function reviewStream(id,ok,reason){const s=S.streams.find(x=>x.id===id);if(!s||s.status!=="REQUESTED")return;if(!can("verification:review"))return toast("Not allowed.");if(s.requestedBy===S.session)return toast("You cannot review your own request.");
 if(ok){const c=S.cases.find(x=>x.id===s.caseId);if(!c||c.status!=="ACTIVE")return toast("The case is no longer active.");s.status="APPROVED"}else{if(!reason)return toast("Enter a reason to reject.");s.status="REJECTED";s.reason=reason}
 s.reviewer=S.session;s.reviewedAt=Date.now();audit("STREAM_"+s.status,id);save();render()}
function goLive(id){const s=S.streams.find(x=>x.id===id);if(!s||s.requestedBy!==S.session||s.status!=="APPROVED")return;const now=Date.now();
 if(now<s.startsAt-SEARLY*60000)return toast("You can go live "+SEARLY+" minutes before the start time.");if(now>s.startsAt+s.durMin*60000)return toast("This slot has passed.");
 const c=S.cases.find(x=>x.id===s.caseId);if(!c||c.status!=="ACTIVE")return toast("The case is no longer active.");s.status="LIVE";s.startedAt=now;audit("STREAM_LIVE",id);save();watchId=id;tab="watch";render()}
function endStream(id,why){const s=S.streams.find(x=>x.id===id);if(!s||s.status!=="LIVE")return;if(s.requestedBy!==S.session&&!can("verification:review"))return toast("Not allowed.");s.status="ENDED";s.endedAt=Date.now();audit(why||"STREAM_ENDED",id);save();render()}
function reportStream(id,reason,details){const s=S.streams.find(x=>x.id===id);if(!s)return"Stream not found.";if(!reason)return"Choose a reason.";if((details||"").length>300)return"Keep the details under 300 characters.";
 if(S.sreports.some(r=>r.streamId===id&&r.email===S.session&&r.status==="OPEN"))return"You already reported this stream.";
 S.sreports.push({id:"rp_"+Date.now().toString(36),streamId:id,email:S.session,reason,details:(details||"").trim(),ms:Date.now(),status:"OPEN"});audit("STREAM_REPORTED",id);save();return null}
function donateItem(id,a){const it=impactItems().find(x=>x.id===id);if(!it)return toast("This case is not available.");if(!can("donation:create"))return toast("Your role cannot donate points.");
 const r=S.raised[id]||0;if(!(a>0))return toast("Enter a number of points.");if(r+a>it.goal)return toast("That is more than the remaining goal ("+(it.goal-r)+").");
 if(post("DONATION",-a,"Donated to "+it.title+" ("+it.sub+") during a live stream","don-"+id+"-"+Date.now())){S.raised[id]=r+a;(S.gifts[S.session]=S.gifts[S.session]||[]).push({id,kind:it.kind,cat:it.cat,amt:a});
  const cs=S.cases.find(c=>c.id===id);if(cs&&S.raised[id]>=cs.amount){cs.status="COMPLETED";cs.history.push({s:"COMPLETED",t:new Date().toISOString()})}save();render();toast("Thank you. "+a+" points sent.")}}
function demoCanvas(el){const g=el.getContext("2d");let t0=Date.now();(function f(){if(!document.body.contains(el))return;const t=(Date.now()-t0)/1000,w=el.width,h=el.height;
 const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,"hsl("+(250+Math.sin(t/2)*30)+",60%,28%)");gr.addColorStop(1,"hsl("+(200+Math.cos(t/3)*30)+",60%,18%)");g.fillStyle=gr;g.fillRect(0,0,w,h);
 g.fillStyle="rgba(255,255,255,.12)";g.beginPath();g.arc(w*(0.5+0.3*Math.sin(t/1.5)),h*(0.5+0.2*Math.cos(t/1.2)),70,0,7);g.fill();
 g.fillStyle="#fff";g.font="bold 28px sans-serif";g.textAlign="center";g.fillText("DEMO STREAM",w/2,h/2-6);g.font="16px sans-serif";g.fillText("No real video in this demo · "+Math.floor(t)+" s",w/2,h/2+24);requestAnimationFrame(f)})()}
let watchId=null;
function liveStrip(){const rows=S.streams.filter(s=>["LIVE","APPROVED"].includes(s.status)&&S.cases.some(c=>c.id===s.caseId));if(!rows.length)return"";
 return`<div class="card"><h3>Live and upcoming streams</h3>${rows.map(s=>{const c=S.cases.find(x=>x.id===s.caseId);return`<div class="dn"><span>${s.status==="LIVE"?'<span class="livebadge">● LIVE</span> ':""}<b>${esc(s.title)}</b><div class="mu">${esc(caseLabel(c))} · ${s.status==="LIVE"?"Live now":"Starts "+fmtT(s.startsAt)}</div></span>${S.session&&canWatch(s)===null&&s.status==="LIVE"?`<button class="pri" data-w="${s.id}">Watch</button>`:""}</span></div>`}).join("")}</div>`}
function impact(){impactBase();if(!S.session)return;tickStreams();const h=liveStrip();if(h){const first=$("app").children[0];if(first)first.insertAdjacentHTML("afterend",h);document.querySelectorAll("#app [data-w]").forEach(b=>b.onclick=()=>{watchId=b.dataset.w;tab="watch";render()})}}
function live(){if(guard())return;tickStreams();const me=S.session,r=role();
 const all=S.streams,liveNow=all.filter(s=>s.status==="LIVE"),up=all.filter(s=>s.status==="APPROVED").sort((a,b)=>a.startsAt-b.startsAt),past=all.filter(s=>["ENDED"].includes(s.status)).slice(-5).reverse();
 const row=(s,k)=>{const c=S.cases.find(x=>x.id===s.caseId)||{cat:"Community",fullName:"?",location:""},why=canWatch(s);
  return`<div class="dn" style="align-items:flex-start;flex-wrap:wrap;gap:8px"><span>${k==="live"?'<span class="livebadge">● LIVE</span> ':""}<b>${esc(s.title)}</b><div class="mu">${esc(caseLabel(c))} · ${esc(S_ACCESS[s.access])} · ${s.durMin} min</div><div class="mu">${k==="live"?"Live now":k==="up"?"Starts "+fmtT(s.startsAt):"Ended "+fmtT(s.endedAt||s.startsAt)}</div>${why&&k!=="past"?`<div class="mu">${esc(why)}</div>`:""}</span>${k!=="past"?`<button class="pri" data-w="${s.id}" ${why||k==="up"?"disabled":""}>${k==="up"?"Not started":"Watch"}</button>`:""}</div>`};
 let h=`<div class="card"><h2>Live streams</h2><p class="mu">Verified impact cases can show their story live. Streams are limited to 60 minutes, need the consent of the person shown, are reviewed before they are scheduled, and can be ended by Givana at any time. This demo has no real video; production uses a streaming provider with protected viewing links.</p></div>
 <div class="card"><h3>Live now</h3>${liveNow.map(s=>row(s,"live")).join("")||'<p class="mu">No stream is live right now.</p>'}</div>
 <div class="card"><h3>Upcoming</h3>${up.map(s=>row(s,"up")).join("")||'<p class="mu">Nothing scheduled.</p>'}</div>
 ${past.length?`<div class="card"><h3>Recently ended</h3>${past.map(s=>row(s,"past")).join("")}</div>`:""}`;

function syncPj(){const d=pjs.draft,v=id=>$(id)?$(id).value.trim():"";d.title=v("pj-title");d.cat=v("pj-cat");d.location=v("pj-loc");d.target=parseInt(v("pj-target"),10)||0;d.cur=v("pj-cur");d.short=v("pj-short");d.story=v("pj-story")}
function setPStatus(id,st){const p=S.projects.find(x=>x.id===id);if(!p||!can("projects:manage"))return;const ok={DRAFT:["APPROVED"],APPROVED:["ACTIVE","COMPLETED"],ACTIVE:["PAUSED","COMPLETED"],PAUSED:["ACTIVE","COMPLETED"],COMPLETED:[]};if(!(ok[p.status]||[]).includes(st))return toast("That change is not allowed.");
 if(p.status==="DRAFT"&&(p.title.length<3||p.short.length<10||p.story.length<50||!p.location))return toast("Complete the title, location, short description and story before publishing.");
 const old=p.status;p.status=st;if(st==="APPROVED")p.published=Date.now();p.history=(p.history||[]).concat([{from:old,to:st,by:S.session,t:Date.now()}]);audit("PROJECT_"+st,id);save();render()}
function bindProjectsAdmin(){const q=(s,f)=>document.querySelectorAll(s).forEach(f);const n=$("pj-new");if(n)n.onclick=()=>{pjs={mode:"edit",draft:blankProject(),added:[]};render()};
 q("[data-pe]",b=>b.onclick=()=>{const p=S.projects.find(x=>x.id===b.dataset.pe);pjs={mode:"edit",draft:JSON.parse(JSON.stringify(p)),added:[]};render()});q("[data-ps]",b=>b.onclick=()=>{const[i,s]=b.dataset.ps.split("|");setPStatus(i,s)});
 const cn=$("pj-cancel");if(cn)cn.onclick=()=>{if(pjs.draft.isNew)pjs.added.forEach(id=>{const m=S.media.find(x=>x.id===id);if(m&&m.idb)idb.del(m.idb);S.media=S.media.filter(x=>x.id!==id)});pjs=null;save();render()};
 q("[data-mc]",b=>b.onclick=()=>{syncPj();pjs.draft.coverId=b.dataset.mc;render()});q("[data-mr]",b=>b.onclick=()=>{syncPj();const m=S.media.find(x=>x.id===b.dataset.mr);if(m&&m.idb)idb.del(m.idb);S.media=S.media.filter(x=>x.id!==b.dataset.mr);if(pjs.draft.coverId===b.dataset.mr)pjs.draft.coverId=null;audit("PROJECT_MEDIA_REMOVED",b.dataset.mr);save();render()});
 const am=$("pj-addm");if(am)am.onclick=async()=>{syncPj();const d=pjs.draft,E=m=>{$("pj-err").textContent=m||""},img=$("pj-img").files[0],vid=$("pj-vid").files[0],url=$("pj-url").value.trim();E("");
  if(!img&&!vid&&!url)return E("Choose an image, a video or a link to add.");const prog=$("pj-prog"),made=[];
  try{if(img){const alt=$("pj-alt").value.trim();if(alt.length<3)return E("Describe the image for screen readers.");const r=await ingestMedia("PROJECT",d.id,{kind:"IMAGE",file:img,alt,title:alt},p=>prog.textContent="Uploading image… "+p+"%");made.push(r.rec)}
   if(vid){const r=await ingestMedia("PROJECT",d.id,{kind:"VIDEO",file:vid,title:$("pj-vt").value.trim()||vid.name.replace(/\.[^.]+$/,"")},p=>prog.textContent="Uploading video… "+p+"%");made.push(r.rec)}
   if(url){const r=await ingestMedia("PROJECT",d.id,{kind:"EMBED",url,title:$("pj-vt").value.trim()||"Video link",cat:d.cat});made.push(r.rec)}}catch(e){return E(String(e))}
  made.forEach(m=>{S.media.push(m);pjs.added.push(m.id);if(!d.coverId&&m.kind==="IMAGE")d.coverId=m.id});audit("PROJECT_MEDIA_ADDED",d.id);save();render();toast("Media added.")};
 const sv=$("pj-save");if(sv)sv.onclick=()=>{if(!can("projects:manage"))return;syncPj();const d=pjs.draft,E=m=>{$("pj-err").textContent=m;toast(m)};
  if(d.title.length<3||d.title.length>80)return E("Title must be 3 to 80 characters.");if(d.location.length<2)return E("Enter a location.");if(d.short.length<10||d.short.length>200)return E("Short description: 10 to 200 characters.");if(d.story.length<50||d.story.length>5000)return E("Full story: 50 to 5000 characters.");if(!(d.target>=0&&d.target<=1e9))return E("Enter a valid target.");
  const cur=S.projects.find(x=>x.id===d.id);if(!cur){const o=Object.assign({},d);delete o.isNew;S.projects.push(o);audit("PROJECT_CREATED",o.id)}else{["title","cat","location","short","story","target","cur","coverId"].forEach(k=>{cur[k]=d[k]});cur.updated=Date.now();audit("PROJECT_EDITED",cur.id)}
  pjs=null;save();render();toast("Project saved.")}}

async function seedHelp(){const L=" (Sample content for this demo. Not a real fundraising campaign.)";
 if(!S.helpSeeded){const mk=(ownerType,ownerId,o)=>{const m=Object.assign({id:"m_"+ownerId+"_"+(o.n||0),ownerType,ownerId,alt:"",created:Date.now()},o);S.media.push(m);return m};
  const P=[["i1","Clean water well, Adama","Water","Adama, Ethiopia","Build a protected well so a village can drink safe water close to home.","A protected well will give about 400 people safe drinking water within a short walk, replacing a two-hour trip to an unsafe pond. Funds pay for drilling, a hand pump, a concrete apron and training for a local water committee that will maintain it."+L,5000,"ACTIVE",[["VIDEO","water","How the well will be built"]]],
   ["i2","Scholarships for 20 students","Education","Addis Ababa, Ethiopia","Pay school fees and materials for 20 students for one year.","Twenty students who qualify but cannot pay will receive tuition, uniforms and books for a full school year. Progress reports are shared with supporters at the end of each term."+L,3000,"ACTIVE",[["IMAGE",null,"Students in a classroom"]]],
   ["i3","Community clinic supplies","Health","Bahir Dar, Ethiopia","Restock a community clinic with basic medicines and equipment.","The clinic serves several villages and regularly runs out of basic medicines, gloves and blood-pressure monitors. This project restocks essentials for six months."+L,2000,"ACTIVE",[["VIDEO","clinic","A tour of the clinic"]]],
   ["p_food","Community food distribution","Food","Hawassa, Ethiopia","Pack and deliver monthly food baskets to families in need.","Volunteers pack staple food baskets (flour, oil, lentils, salt) and deliver them to families who registered with local community leaders. Two short videos show packing day and delivery day."+L,8000,"ACTIVE",[["VIDEO","food1","Packing the food baskets"],["VIDEO","food2","Delivery day"]]],
   ["p_women","Women's empowerment workshops","Women","Bahir Dar, Ethiopia","Skills and savings workshops for women who run small businesses.","Twelve weekly workshops on bookkeeping, savings groups and marketing for women entrepreneurs. Starts after the venue is confirmed."+L,4000,"APPROVED",[["IMAGE",null,"Workshop planning"]]],
   ["p_school","School supply drive","Education","Dire Dawa, Ethiopia","Notebooks, pens and bags for a rural primary school.","Completed: every pupil received a bag with notebooks and pens at the start of term."+L,1500,"COMPLETED",[["VIDEO","school","Handing out the school bags"]]]];
  P.forEach(([id,title,cat,loc,short,story,target,status,media],i)=>{S.projects.push({id,title,cat,location:loc,short,story,target,cur:"ETB",status,created:Date.now()-(P.length-i)*864e5,published:Date.now()-(P.length-i)*864e5,createdBy:"system",demo:true,coverId:null,history:[]});
   media.forEach(([k,clip,t],n)=>{const m=mk("PROJECT",id,{n,kind:k,title:t,thumb:hmCover(t+(k==="VIDEO"?" ▶":""),cat),alt:t+" (illustration)"});if(k==="VIDEO"){m.idb="demo_"+clip;m.demoClip=clip;m.mime="video/webm";m.dur=({water:5,clinic:8,food1:6,food2:7,school:9})[clip]}else m.src=m.thumb});
   if(!S.projects[S.projects.length-1].coverId){const f=S.media.find(m=>m.ownerId===id&&m.kind==="IMAGE");if(f)S.projects[S.projects.length-1].coverId=f.id}});
  S.raised.p_school=1500;
  S.users["sample@demo.invalid"]=S.users["sample@demo.invalid"]||{name:"Sample Owner",country:"ET",created:1,role:"MEMBER",code:"SMPL01",ref:null,demo:true,approved:true};
  const C=[["r_med","INDIVIDUAL","Sample Patient","Surgery fund for a sample patient","Medical","Adama, Ethiopia","Help cover the cost of a planned operation and recovery.","This is sample content that shows how an approved individual request looks. A patient needs an operation and several weeks of recovery care. Reviewers would have checked identity and medical letters, which stay private."+L,4000,"VERIFIED",[["IMAGE",null,"Sample patient request"]]],
   ["r_edu","ORG","Sample Community School","New desks for a village school","Education","Hawassa, Ethiopia","A registered community school asks for desks and chairs for two classrooms.","This is sample content that shows an approved organization request with a video. The school would have provided its registration document and photos, which stay private."+L,2500,"ACTIVE",[["VIDEO","req","Our classrooms today"]]],
   ["r_food","INDIVIDUAL","Sample Family","Food support for a sample family","Family","Dire Dawa, Ethiopia","Two months of food for a family after a job loss.","Completed sample request: the target was reached and the family received food support."+L,1200,"COMPLETED",[["IMAGE",null,"Sample family request"]]]];
  C.forEach(([id,type,name,title,cat,loc,short,story,amount,status,media],i)=>{const iso=new Date(Date.now()-(C.length-i)*864e5).toISOString();S.cases.push({id,owner:"sample@demo.invalid",applicantType:type,fullName:name,email:"sample"+i+"@demo.invalid",phone:"+2519000000"+i,country:"ET",city:loc.split(",")[0],location:loc,title,cat,short,story,support:"Financial",amount,cur:"ETB",benef:"Sample beneficiaries",people:5,contact:"Email",privacy:type==="ORG"?"FULL":"INITIAL",docFiles:[],docs:[],media:[],checks:{id:1,doc:1,fraud:1,assess:1},status,reason:"",history:[{s:status,t:iso}],reviews:[],createdAt:iso,decidedAt:Date.now()-(C.length-i)*864e5+1e5,demo:true});
   media.forEach(([k,clip,t],n)=>{const m=mk("REQUEST",id,{n,kind:k,title:t,thumb:hmCover(t+(k==="VIDEO"?" ▶":""),cat),alt:t+" (illustration)"});if(k==="VIDEO"){m.idb="demo_"+clip;m.demoClip=clip;m.mime="video/webm";m.dur=4}else m.src=m.thumb})});
  S.raised.r_food=1200;S.helpSeeded=true;save()}
 try{for(const m of S.media){if(m.demoClip&&!(await idb.get(m.idb))){const bin=atob(DEMO_CLIPS[m.demoClip]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);await idb.put(m.idb,new Blob([u],{type:"video/webm"}))}}}catch(e){}}
function impactItems(){const cs=S.cases.filter(c=>c.status==="ACTIVE"||c.status==="COMPLETED").map(c=>({id:c.id,kind:"case",cat:c.cat,title:c.title||(CATS[c.cat]+" "+c.cat+" support"),sub:pubName(c)+" · "+c.location,story:c.short||c.story,goal:c.amount,cur:c.cur,label:(c.cat==="Medical"?"Patient":c.cat==="Education"?"Student":"Beneficiary")+": Verified",done:c.status==="COMPLETED"})).filter(x=>x.goal>0);

   ["video","Sample video update (demonstration)","A layout example for a video update. The clip is a generated test clip.","videos",6,[],["water","Demonstration clip",5],"This is demonstration content. The video is a generated test clip, not a real Givana activity."]];
  D.forEach(([slug,title,summary,ck,ago,imgs,vid,body])=>{const pid="p_demo_"+slug,ms=imgs.map(([t0,c],n)=>mkImg(pid,t0,c,n));if(vid)ms.push(mkVid(pid,vid[0],vid[1],vid[2]));S.media.push(...ms);

"bn.srv.members":["This screen is for members. Staff use the Staff workspace.","ይህ ገጽ ለአባላት ነው። ሠራተኞች የሠራተኞችን የሥራ ቦታ ይጠቀማሉ።","Cet écran est réservé aux membres. Le personnel utilise l'espace du personnel.","Esta pantalla es para miembros. El personal usa el espacio del personal.","هذه الشاشة للأعضاء. يستخدم الموظفون مساحة الموظفين."],
"bn.edir.rules":["How Edir works","እድር እንዴት ይሠራል","Comment fonctionne Edir","Cómo funciona Edir","كيف يعمل «إدِر»"],
"bn.edir.r1":["Only your existing Givana monthly contribution counts. There is no separate Edir fee.","ያለዎት የGivana ወርሃዊ መዋጮ ብቻ ይቆጠራል። የተለየ የእድር ክፍያ የለም።","Seule votre cotisation mensuelle Givana compte. Aucun frais Edir distinct.","Solo cuenta su cuota mensual de Givana. No hay cuota Edir aparte.","تُحتسب مساهمتك الشهرية في Givana فقط. لا توجد رسوم «إدِر» منفصلة."],
"bn.edir.r2":["You need {m} months of membership and a contribution continuity of at least {c}.","{m} ወር አባልነትና ቢያንስ {c} የመዋጮ ቀጣይነት ያስፈልጋል።","Il faut {m} mois d'adhésion et une continuité de cotisation d'au moins {c}.","Se requieren {m} meses de membresía y una continuidad de aportes de al menos {c}.","يلزم {m} أشهر من العضوية واستمرارية مساهمة لا تقل عن {c}."],
"bn.edir.r3":["Your family registry must be submitted and verified. Each person is reviewed.","የቤተሰብ መዝገብዎ መቅረብና መረጋገጥ አለበት። እያንዳንዱ ሰው ይገመገማል።","Votre registre familial doit être soumis et vérifié. Chaque personne est examinée.","Su registro familiar debe enviarse y verificarse. Cada persona se revisa.","يجب تقديم سجل أسرتك والتحقق منه. تُراجع كل شخص."],
"bn.edir.r4":["Support amounts: member {a}; mother, father, spouse or child {b}; sister or brother {c}.","የድጋፍ መጠን፦ አባል {a}፤ እናት፣ አባት፣ የትዳር ጓደኛ ወይም ልጅ {b}፤ እህት ወይም ወንድም {c}።","Montants : membre {a} ; mère, père, conjoint ou enfant {b} ; sœur ou frère {c}.","Montos: miembro {a}; madre, padre, cónyuge o hijo {b}; hermana o hermano {c}.","المبالغ: العضو {a}؛ الأم أو الأب أو الزوج أو الابن {b}؛ الأخت أو الأخ {c}."],
"bn.edir.r4x":["Support amounts are set by the organization and shown once the server is connected.","የድጋፍ መጠኖች በድርጅቱ የሚወሰኑ ሲሆን አገልጋዩ ሲገናኝ ይታያሉ።","Les montants sont fixés par l'organisation et affichés une fois le serveur connecté.","Los montos los fija la organización y se muestran al conectar el servidor.","تحدد المؤسسة المبالغ وتظهر بعد الاتصال بالخادم."],
"bn.edir.r5":["Claims need verified evidence, a different reviewer and a finance confirmation. Nothing is shown as paid until the payment is confirmed.","የይገባኛል ጥያቄዎች የተረጋገጠ ማስረጃ፣ የተለየ ገምጋሚና የፋይናንስ ማረጋገጫ ይፈልጋሉ። ክፍያው እስኪረጋገጥ ድረስ እንደተከፈለ አይታይም።","Les demandes exigent des preuves vérifiées, un examinateur différent et une confirmation financière. Rien n'est affiché comme payé avant confirmation.","Las reclamaciones requieren pruebas verificadas, otro revisor y confirmación financiera. Nada se muestra como pagado hasta confirmarse.","تحتاج المطالبات إلى أدلة موثّقة ومراجع آخر وتأكيد مالي. لا يظهر شيء كمدفوع قبل تأكيد الدفع."],

async function bnApi(path,o={}){const u=FIN.url.replace(/\/$/,"");const r=await fetch(u+path,{method:o.method||"GET",headers:Object.assign({"content-type":"application/json"},FIN.token?{authorization:"Bearer "+FIN.token}:{}),body:o.body?JSON.stringify(o.body):undefined});
 if(o.raw){if(!r.ok)throw new Error("HTTP "+r.status);return r.blob()}
 const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error((j.error||"HTTP "+r.status)+(j.reasons?": "+j.reasons.join("; "):(j.message&&j.message!==j.error?": "+j.message:"")));e.code=j.error;throw e}return j}

const GV={open:null,pv:null,key:null,msg:""};
async function givingPanel(){
 if(!FIN.url||!FIN.token||!$("app"))return;
 let list;try{list=await bnApi("/me/giving/pending")}catch(e){return}
 if(!Array.isArray(list)||!list.length||tab!=="wallet")return;
 let box=$("givbox");if(!box){box=document.createElement("div");box.id="givbox";$("app").appendChild(box)}
 const pend=list.filter(d=>d.status!=="CONFIRMED"),done=list.filter(d=>d.status==="CONFIRMED");
 box.innerHTML=`<div class="card"><h2>Monthly reward: your decision</h2><p class="mu">When you carry a monthly A\u2013F reward forward, 30% of <b>that month's new reward only</b> goes to charitable support (paid to the recipient in ETB, 1 point = 1 ETB) and 70% stays yours. Earlier points are never touched. A pending reward waits for you with no deadline.</p>
 ${pend.map(d=>`<div class="row"><div><b>${esc(d.period)}</b>: ${d.rewardPoints} points \u2022 giving ${d.givingPoints} \u2022 you keep ${d.retainedPoints}${d.status==="PARTIAL"?` \u2022 ${d.unassignedGivingPoints} still to assign`:""}</div><button class="btn pri" data-gv="${d.id}">Review and decide</button></div>`).join("")||'<p class="mu">Nothing is waiting for your decision.</p>'}
 ${done.length?`<p class="mu">Completed: ${done.map(d=>esc(d.period)+" ("+d.givingPoints+" given)").join(", ")}</p>`:""}
 <div id="givdet"></div></div>`;
 box.querySelectorAll("[data-gv]").forEach(b=>b.onclick=()=>givOpen(+b.dataset.gv));
 if(GV.open)givOpen(GV.open,true);
}
async function givOpen(id,keep){
 GV.open=id;if(!keep){GV.key=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/[^\w-]/g,"");GV.msg=""}
 const det=$("givdet");if(!det)return;
 try{GV.pv=await bnApi(`/me/giving/${id}/preview`)}catch(e){det.innerHTML=`<p role="alert">${esc(e.message)}</p>`;return}
 const p=GV.pv,left=p.unassignedGivingPoints;
 det.innerHTML=`<hr><h3>${esc(p.period)}: review before you confirm</h3>
 <table class="tbl"><tr><td>New monthly reward</td><td><b>${p.rewardPoints}</b></td></tr><tr><td>Your previous balance</td><td>${p.previousAccumulatedPoints}</td></tr><tr><td>Mandatory giving (30%, rounded down)</td><td><b>${p.givingPoints}</b>${p.alreadyAssignedPoints?` (${p.alreadyAssignedPoints} already assigned)`:""}</td></tr><tr><td>You keep (70%)</td><td><b>${p.retainedPoints}</b></td></tr><tr><td>Your balance after confirming</td><td><b>${p.newBalanceAfterConfirm}</b></td></tr></table>
 ${left>0?`<h4>Choose who receives your ${left} points (as ETB support)</h4>${p.eligibleRecipients.length?p.eligibleRecipients.map(r=>`<div class="card"><b>${esc(r.name)}</b> <span class="mu">(${esc(r.kind)} \u2022 ${esc(r.source)} \u2022 ${esc(r.verification)})</span><div class="mu">${esc(r.purpose)}</div><div class="mu">Target ${(r.targetMinor/100).toLocaleString()} ETB \u2022 raised ${(r.raisedMinor/100).toLocaleString()} ETB \u2022 can still receive ${r.remainingPoints} points</div><label>Points <input type="number" min="0" max="${Math.min(left,r.remainingPoints)}" step="1" value="0" data-rc="${esc(r.id)}" aria-label="Points for ${esc(r.name)}"></label></div>`).join(""):'<p class="mu">No eligible recipients are available right now. Your reward stays pending.</p>'}
 <p>Total chosen: <b id="gvtot">0</b> of ${left}</p><label><input type="checkbox" id="gvpart"> Leave the unassigned part pending (your 70% is released only when all ${p.givingPoints} points are assigned)</label>`:`<p class="mu">${p.givingPoints===0?"This reward is too small to include a giving amount.":"Your giving amount is fully assigned."}</p>`}
 <details${p.bankRegistered?"":" open"}><summary>My bank account (for the self-giving safety check)${p.bankRegistered?" \u2713 saved":" \u2013 required before you can confirm"}</summary><p class="mu">Stored only as a one-way hash. Used to stop giving to yourself or a related account.</p><input id="gvbank" placeholder="Bank account number" autocomplete="off"> <button class="btn" id="gvbanksave">Save</button></details>
 <p id="gvmsg" role="alert">${esc(GV.msg)}</p><button class="btn pri" id="gvgo">${left>0?"Confirm and carry forward":"Carry forward"}</button>`;
 const inputs=[...det.querySelectorAll("[data-rc]")],tot=()=>inputs.reduce((s,i)=>s+(parseInt(i.value,10)||0),0);
 inputs.forEach(i=>i.oninput=()=>{$("gvtot").textContent=tot()});
 $("gvbanksave").onclick=async()=>{try{await bnApi("/me/giving/bank",{method:"POST",body:{bankAccount:$("gvbank").value}});$("gvbank").value="";GV.msg="Bank account saved.";givOpen(id,true)}catch(e){$("gvmsg").textContent=e.message}};
 $("gvgo").onclick=async()=>{
  const allocations=inputs.map(i=>({recipientId:i.dataset.rc,points:parseInt(i.value,10)||0})).filter(a=>a.points>0),part=!!($("gvpart")&&$("gvpart").checked);
  if(left>0&&!allocations.length)return $("gvmsg").textContent="Select a recipient and enter the points to give.";
  if(left>0&&!part&&tot()!==left)return $("gvmsg").textContent=`The total must be exactly ${left} points, or tick \u201cleave the rest pending\u201d.`;
  $("gvgo").disabled=true;
  try{const r=await bnApi(`/me/giving/${id}/confirm`,{method:"POST",body:{allocations,allowPartial:part,idemKey:GV.key}});
   GV.open=r.status==="PARTIAL"?id:null;GV.key=null;toast(r.status==="CONFIRMED"?"Carried forward. Your balance is "+r.newBalance+".":r.cappedAtRemainingTarget?"Part given. A campaign reached its target; choose another recipient for the rest.":"Saved. The rest is still pending.");
   if(r.status==="PARTIAL")GV.msg="Choose another recipient for the remaining points, or leave them pending.";givingPanel()}
  catch(e){GV.msg=e.message;$("gvgo").disabled=false;$("gvmsg").textContent=e.message}};
}

 const bad=()=>{e.msg=t("bn.o.err");bnMgrDraw()},num=v=>v===""||v==null?null:Number(v),pr=num(e.price),op=num(e.origPrice);

// ================= Sponsors menu: sections =================
let spSec="all";
const SP_SECS=[["all","All"],["plans","Plans"],["store","Store & products"],["campaigns","Campaigns"],["analytics","Analytics"],["verify","Verification"],["renew","Renewal"],["videos","Promo videos"]];
function spSectionOf(el,prev){const h=(el.querySelector("h2,h3")||{}).textContent||"";
 if(/Sponsor subscription|Checkout:|^(Bronze|Silver|Gold|Platinum|Diamond)$/.test(h.trim())||el.classList.contains("grid"))return"plans";
 if(/Add a product/.test(h))return"store";if(/^Campaigns/.test(h))return"campaigns";if(/^Analytics/.test(h))return"analytics";if(/Verification details/.test(h))return"verify";if(/Subscription and renewal/.test(h))return"renew";if(/Promo videos/.test(h))return"videos";
 return prev==="plans"&&!el.classList.contains("card")?"plans":(prev==="plans"?"store":prev)}
function applySpMenu(){const app=$("app");[...app.children].forEach(el=>{if(el.classList.contains("spmenu"))return;el.hidden=spSec!=="all"&&el.dataset.sec!==spSec});
 app.querySelectorAll(".spmenu button").forEach(b=>{b.classList.toggle("on",b.dataset.sp===spSec);b.setAttribute("aria-pressed",String(b.dataset.sp===spSec))})}
function decorateSponsorMenu(){const app=$("app");if(!app||!app.children.length)return;const first=app.children[0].querySelector("h2");if(!first||!/Sponsor subscription/.test(first.textContent))return;
 let prev="plans";[...app.children].forEach(el=>{prev=el.dataset.sec=spSectionOf(el,prev)});
 app.insertAdjacentHTML("afterbegin",`<nav class="spmenu" aria-label="Sponsor sections">${SP_SECS.map(([k,n])=>`<button data-sp="${k}" class="${spSec===k?"on":""}" aria-pressed="${spSec===k}">${n}</button>`).join("")}</nav>`);
 app.querySelectorAll(".spmenu button").forEach(b=>b.onclick=()=>{spSec=b.dataset.sp;applySpMenu();window.scrollTo(0,0)});applySpMenu()}
function sponsors(){sponsorsFull();decorateSponsorMenu()}
